# Minimal air config for the app module. Excludes non-Go data dirs from the watch.
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  entrypoint = "tmp/main"
  cmd = "go build -o tmp/main ."
  delay = 500
  exclude_dir = ["assets", "tmp", "vendor", "testdata", ".data", ".wrangler", "docs"]
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  include_dir = ["src/config", "src/database", "src/services"]
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "json"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
